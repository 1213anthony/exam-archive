<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 학교 내부 자료라 검색엔진에는 안 잡히게 한다 (링크를 아는 사람만 접근) -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>기출문제 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="data.js"></script>
<style>
  :root {
    /* 무채색 위주 + 포인트 색 하나(청회색)만 쓴다 */
    --paper: #FAFAFA;
    --card: #FFFFFF;
    --line: #E0E0E0;
    --line-soft: #EEEEEE;
    --ink: #1B1B1B;
    --ink-mid: #5C5C5C;
    --ink-soft: #979797;
    --accent: #35566E;        /* 포인트: 차분한 청회색 */
    --accent-soft: #EDF1F4;
    --green: #35566E;         /* 해설도 같은 계열 - 채도로만 구분 */
    --green-soft: #F4F6F7;
    --blue: #35566E;
    --blue-soft: #EDF1F4;
    --red: #6B6B6B;           /* 경고도 원색 대신 회색 */
    --red-soft: #F0F0F0;
    --star: #35566E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", ui-sans-serif, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 100px; }

  header { border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
  h1 {
    font-family: Georgia, "Nanum Myeongjo", ui-serif, serif;
    font-size: 30px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em;
  }
  header p { margin: 0; color: var(--ink-soft); font-size: 13.5px; }

  /* ---- 검색 + 분류 탭 ---- */
  .searchbar { margin: 22px 0 14px; display: flex; gap: 8px; }
  .searchbar input {
    flex: 1; font: inherit; font-size: 16px; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink);
  }
  .searchbar input:focus { outline: none; border-color: var(--green); }
  .searchbar button {
    font: inherit; font-size: 13px; padding: 0 14px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink-mid);
    white-space: nowrap;
  }
  .searchbar button.on { background: var(--red-soft); border-color: var(--red); color: var(--red); }

  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .cat {
    font-size: 13.5px; padding: 7px 13px; cursor: pointer; user-select: none;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink-mid);
  }
  .cat:hover { border-color: var(--ink-soft); }
  .cat.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .cat .n { opacity: .55; margin-left: 5px; font-size: 12px; }

  .statusline {
    font-size: 12.5px; color: var(--ink-soft);
    margin: 16px 0 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft);
  }

  /* ---- 분류 섹션 (국어/수학/… 통째로 접기) ---- */
  details.category { margin-top: 30px; }
  details.category > summary {
    cursor: pointer; list-style: none; user-select: none;
    display: flex; align-items: baseline; gap: 9px;
    padding: 9px 2px; border-bottom: 2px solid var(--ink);
  }
  details.category > summary::-webkit-details-marker { display: none; }
  details.category > summary::before {
    content: "▾"; color: var(--ink-mid); font-size: 12px; width: 12px; flex-shrink: 0;
  }
  details.category:not([open]) > summary::before { content: "▸"; }
  details.category:not([open]) > summary { border-bottom-color: var(--line); }
  details.category > summary:hover .cat-name { color: var(--accent); }
  /* 분류가 과목보다 한 단계 위라는 게 보이도록 더 크고 진하게 */
  .cat-name {
    font-family: Georgia, "Nanum Myeongjo", ui-serif, serif;
    font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -.01em;
  }
  .cat-meta { font-size: 12px; color: var(--ink-soft); }
  /* 분류 안의 과목은 한 칸 들여쓴다 */
  details.category > details.subject { margin-left: 14px; }

  /* ---- 과목 섹션 ---- */
  details.subject { border-bottom: 1px solid var(--line-soft); }
  details.subject > summary {
    cursor: pointer; list-style: none; padding: 14px 2px;
    display: flex; align-items: baseline; gap: 10px;
  }
  details.subject > summary::-webkit-details-marker { display: none; }
  details.subject > summary::before {
    content: "▸"; color: var(--ink-soft); font-size: 12px; width: 12px; flex-shrink: 0;
  }
  details.subject[open] > summary::before { content: "▾"; }
  .subj-name { font-size: 16px; font-weight: 600; }
  .subj-meta { font-size: 12.5px; color: var(--ink-soft); }
  .subj-body { padding: 2px 0 16px 22px; }
  .star {
    margin-left: auto; font-size: 17px; line-height: 1; color: var(--ink-soft);
    cursor: pointer; user-select: none; padding: 2px 4px;
  }
  .star:hover { color: var(--star); }
  .star.on { color: var(--star); }

  /* ---- 시험 한 줄 (문제지 + 해설 나란히) ---- */
  .exam {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 0; border-top: 1px solid var(--line-soft);
  }
  .exam:first-child { border-top: none; }
  .exam.exam-clustered { align-items: flex-start; }
  .exam-label { flex: 1; min-width: 0; }
  .exam-when { font-size: 14.5px; }
  .exam-when .yr { font-family: Georgia, "Nanum Myeongjo", serif; font-weight: 700; }
  .exam-when .unknown { color: var(--ink-soft); font-style: italic; }
  .exam-files { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; word-break: break-all; }
  .btns { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 300px; }
  .btns-clustered { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; align-items: flex-end; }
  .mini-cluster { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .mini-label { font-size: 11.5px; color: var(--ink-mid); white-space: nowrap; }
  a.btn {
    font-size: 12.5px; text-decoration: none; padding: 6px 12px;
    border-radius: 4px; border: 1px solid; white-space: nowrap;
  }
  /* 색을 두 개 쓰는 대신, 문제=채움 / 해설=외곽선 으로 구분한다 */
  a.btn.q { color: #fff; border-color: var(--accent); background: var(--accent); }
  a.btn.q:hover { background: #244052; border-color: #244052; }
  a.btn.a { color: var(--accent); border-color: var(--line); background: var(--card); }
  a.btn.a:hover { border-color: var(--accent); background: var(--accent-soft); }
  span.btn-none {
    font-size: 12.5px; padding: 6px 12px; border-radius: 4px;
    border: 1px dashed var(--line); color: var(--ink-soft); white-space: nowrap;
  }
  .flag {
    display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px;
    background: var(--red-soft); color: var(--red); margin-left: 6px; vertical-align: 1px;
  }
  /* 중복 합침 / 폴더 위치 안내는 "데이터 오류"가 아니라서 눈에 덜 띄게 */
  .flag.dup, .flag.muted { background: var(--line-soft); color: var(--ink-soft); }

  /* 직접 정리하는 버튼들 */
  .reviewbtn {
    font: inherit; font-size: 11px; margin-left: 6px; padding: 1px 8px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--card); color: var(--ink-soft); vertical-align: 1px;
  }
  .reviewbtn:hover { border-color: var(--accent); color: var(--accent); }
  .reviewbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hidebtn {
    font: inherit; font-size: 13px; line-height: 1; margin-left: 2px; padding: 3px 5px;
    cursor: pointer; border: 1px solid transparent; border-radius: 3px;
    background: transparent; color: var(--ink-soft);
  }
  .hidebtn:hover { border-color: var(--line); background: var(--line-soft); color: var(--ink); }
  .hiddennote {
    font-size: 12.5px; color: var(--ink-mid); background: var(--line-soft);
    border-radius: 4px; padding: 8px 12px; margin: 10px 0 0;
  }
  .hiddennote button {
    font: inherit; font-size: 12px; margin-left: 8px; padding: 3px 9px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--ink-mid);
  }
  .hiddennote button:hover { border-color: var(--accent); color: var(--accent); }
  .extra { margin-top: 4px; }
  .extra a { font-size: 11.5px; color: var(--ink-mid); margin-right: 10px; }

  .empty { padding: 50px 0; text-align: center; color: var(--ink-soft); font-size: 14px; }
  .empty a { color: var(--blue); }

  /* ---- 체크박스 + 선택 다운로드 ---- */
  .btn-wrap { display: inline-flex; align-items: center; gap: 3px; }
  .pick { cursor: pointer; accent-color: var(--blue); width: 14px; height: 14px; margin: 0; }
  .selectbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--ink); color: #fff; padding: 12px 20px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    box-shadow: 0 -2px 14px rgba(0,0,0,.18); font-size: 13.5px;
  }
  .selectbar button {
    font: inherit; font-size: 13px; padding: 8px 16px; cursor: pointer;
    border-radius: 4px; border: 1px solid transparent;
  }
  #downloadBtn { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  #downloadBtn:hover { background: var(--blue); color: #fff; }
  #clearSelBtn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
  #clearSelBtn:hover { border-color: #fff; }

  @media (max-width: 600px) {
    .exam, .exam.exam-clustered { flex-wrap: wrap; }
    .btns, .btns-clustered { max-width: none; width: 100%; justify-content: flex-start; margin-top: 4px; }
    .mini-cluster { justify-content: flex-start; }
    .selectbar { flex-wrap: wrap; text-align: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>기출문제 아카이브</h1>
    <p>분류 → 과목 → 시험 순으로 정리했고, 문제지와 해설은 한 줄에 같이 있습니다.</p>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="과목, 연도, 파일명으로 검색…" autocomplete="off">
    <button id="favbtn" title="과목 이름 옆 별표로 즐겨찾기한 과목만 보기">즐겨찾기만</button>
    <button id="flagbtn" title="문제지나 해설 한쪽이 안 보이는 시험만 보기">정리 필요만</button>
  </div>
  <div class="cats" id="cats"></div>
  <div class="statusline" id="status"></div>
  <div class="hiddennote" id="hiddennote" style="display:none;"></div>
  <div id="out"></div>
  <div class="empty" id="empty" style="display:none;">해당하는 자료가 없습니다.</div>
</div>

<div class="selectbar" id="selectbar" style="display:none;">
  <span id="selcount"></span>
  <button id="downloadBtn" title="각 파일을 드라이브 보기 화면으로 새 탭에 엽니다">선택한 파일 열기</button>
  <button id="clearSelBtn">선택 해제</button>
</div>

<script>
var DATA = (typeof EXAM_DATA !== 'undefined') ? EXAM_DATA : [];

// 학교에서 쓰는 12개 분류 순서 (데이터에 없는 분류는 자동으로 숨김)
var CAT_ORDER = ['국어','수학','물리','화학','생명과학','지구과학','정보',
                 '사회','외국어','실험','예체능','창의융합특강'];

// ---- 즐겨찾기 (localStorage, 브라우저별로 저장) ----
var FAV_KEY = 'examArchive.favorites.v1';
var FAVONLY_KEY = 'examArchive.favOnly.v1';

function loadFavorites() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveFavorites(favs) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {}
}
function loadFavOnly() {
  try {
    var v = localStorage.getItem(FAVONLY_KEY);
    return v === null ? true : v === '1'; // 처음 방문 땐 기본 켜짐(요청사항)
  } catch (e) { return true; }
}
function saveFavOnly(v) {
  try { localStorage.setItem(FAVONLY_KEY, v ? '1' : '0'); } catch (e) {}
}

var favorites = loadFavorites();
function favKey(cat, subj) { return cat + '|' + subj; }
function isFavorite(cat, subj) { return !!favorites[favKey(cat, subj)]; }
function toggleFavorite(cat, subj) {
  var k = favKey(cat, subj);
  if (favorites[k]) delete favorites[k]; else favorites[k] = true;
  saveFavorites(favorites);
}
function hasAnyFavorite() { return Object.keys(favorites).length > 0; }

// ---- 직접 정리한 내역 (localStorage) ----------------------------------------
// 1) reviewed: "정리 필요"에서 확인 끝난 시험 - 목록에서 빠진다
// 2) hidden:   같은 파일이 두 벌인데 자동으로 못 걸러낸 것 - 하나를 숨긴다
//    (드라이브 파일을 지우는 게 아니라 이 브라우저에서 안 보이게만 하는 것.
//     실제로 지우려면 숨긴 목록을 내보내서 delete_files.py로 넘기면 된다)
var REVIEWED_KEY = 'examArchive.reviewed.v1';
var HIDDEN_KEY = 'examArchive.hidden.v1';

function loadMap(key) {
  try { return JSON.parse(localStorage.getItem(key) || '{}'); }
  catch (e) { return {}; }
}
function saveMap(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
}

var reviewed = loadMap(REVIEWED_KEY);
var hidden = loadMap(HIDDEN_KEY);

function isReviewed(k) { return !!reviewed[k]; }
function markReviewed(k, on) {
  if (on) reviewed[k] = new Date().toISOString().slice(0, 10);
  else delete reviewed[k];
  saveMap(REVIEWED_KEY, reviewed);
}
// 어떤 분류를 접어뒀는지 이 브라우저에만 기억해둔다
var CATFOLD_KEY = 'archive.catclosed';
var catClosed = loadMap(CATFOLD_KEY);
function isCatClosed(c) { return !!catClosed[c]; }
function setCatClosed(c, closed) {
  if (closed) catClosed[c] = 1; else delete catClosed[c];
  saveMap(CATFOLD_KEY, catClosed);
}

function isHidden(r) { return !!hidden[r.id]; }
function unhideAll() { hidden = {}; saveMap(HIDDEN_KEY, hidden); }

var state = { cat: null, q: '', flagOnly: false, favOnly: loadFavOnly(), selected: {} };

// ---- 선택 다운로드 ----
// data.js에는 용량을 줄이려고 url을 안 싣는다. id로 만들어 쓴다.
function viewUrl(r) { return r.url || ('https://drive.google.com/file/d/' + r.id + '/view'); }
function isSelected(r) { return !!state.selected[r.id]; }
function toggleSelect(r, on) {
  if (on) state.selected[r.id] = r; else delete state.selected[r.id];
  updateSelectionBar();
}
function updateSelectionBar() {
  var ids = Object.keys(state.selected);
  var bar = document.getElementById('selectbar');
  document.getElementById('selcount').textContent = ids.length + '개 선택됨';
  bar.style.display = ids.length ? 'flex' : 'none';
}
function makeCheckbox(r) {
  var cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'pick';
  cb.title = '선택해서 나중에 한 번에 다운로드';
  cb.checked = isSelected(r);
  cb.addEventListener('click', function (e) { e.stopPropagation(); });
  cb.addEventListener('change', function () { toggleSelect(r, cb.checked); });
  return cb;
}

function isSolution(dt) {
  if (!dt) return false;
  return dt.indexOf('답안') >= 0 || dt.indexOf('해설') >= 0 || dt.indexOf('정답') >= 0;
}
function isProblem(dt) {
  return !!dt && dt.indexOf('문제') >= 0;
}
// "정리 필요"는 문제지나 해설 한쪽이 안 보이는 시험만 모은다.
// 예전엔 파일명 규칙에 안 맞는(parsed_ok=false) 파일을 전부 넣었는데, 연도·학기가
// 폴더에서 제대로 채워져서 화면에는 멀쩡히 뜨는 줄까지 잔뜩 걸렸다. 여기서 할
// 일이 있는 건 결국 "한쪽이 없는" 줄뿐이다.
var INCOMPLETE = null;
function incompleteExams() {
  if (INCOMPLETE) return INCOMPLETE;
  INCOMPLETE = {};
  var bySubject = {};
  DATA.forEach(function (r) {
    var sk = (r.category || '') + '||' + (r.subject || '');
    (bySubject[sk] = bySubject[sk] || []).push(r);
  });
  Object.keys(bySubject).forEach(function (sk) {
    var exams = {};
    bySubject[sk].forEach(function (r) {
      (exams[examKey(r)] = exams[examKey(r)] || []).push(r);
    });
    Object.keys(exams).forEach(function (ek) {
      // 화면에 그리는 것과 같은 방식으로 묶어서 본다(중복 합치기 + 세부과목 나누기)
      var group = dedupeRecords(exams[ek]);
      var clusters = clusterGroup(group);
      var units = clusters ? clusters.map(function (c) { return c.records; }) : [group];
      var bad = units.some(function (u) {
        return !u.some(function (r) { return isProblem(r.doctype); })
            || !u.some(function (r) { return isSolution(r.doctype); });
      });
      if (bad) INCOMPLETE[(sk.split('||')[0]) + '||' + ek] = 1;
    });
  });
  return INCOMPLETE;
}
function isFlagged(r) {
  if (!incompleteExams()[(r.category || '') + '||' + examKey(r)]) return false;
  return !isReviewed(examKey(r));   // "확인함"으로 처리한 시험은 목록에서 뺀다
}
function examKey(r) {
  return [r.subject, r.year || '?', r.semester || '?', r.examtype || '?'].join('|');
}
// 한 해 안에서 시험이 실제로 치러지는 순서. 큰 값일수록 최근이다.
// 겨울 계절수업은 2학기 기말(12월) 다음인 이듬해 1월에 본다.
function examOrder(semester, examtype) {
  var t = examtype || '';
  if (t.indexOf('계절') >= 0) return 5;
  var base = semester === '2' ? 2 : (semester === '1' ? 0 : -2);
  return base + (t.indexOf('기말') >= 0 ? 2 : 1);
}

function matchesQuery(r, q) {
  if (!q) return true;
  var hay = [r.category, r.subject, r.year, r.semester, r.examtype, r.doctype, r.filename]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.indexOf(q.toLowerCase()) >= 0;
}

// ---- 한 시험 줄에 파일이 너무 많이 몰릴 때(예: "문학" 폴더에 고전문학/현대문학이
// 섞여있는 경우) 화면 표시만 파일명 속 세부과목(subject_detail)으로 나눠서 보여준다.
// 주의: 이건 순수 표시용 - 문제/해설 페어링(examKey)에는 전혀 영향 안 줌. 표기
// 흔들림(고급물리학I/1/Ⅰ 등)이 있어서 매칭 키로 쓰면 오히려 페어가 깨지는 걸
// 확인했음(crawl.py 주석 참고).
function normDetail(s) {
  if (!s) return null;
  s = s.replace(/\s+/g, '');
  // 파일명이 잘려 들어와 문서유형이 앞에 붙는 경우: "문제지(고급물리학1)"
  s = s.replace(/^(모범답안및해설|모범답안|정답및해설|문제지|해설|정답|답안|문제)[_(\-]*/, '');
  // 학년(2학년/3학년)은 실제로 다른 시험이라 따로 떼어 보관하고 이름에서는 뺀다
  s = s.replace(/[1-3]\s*학년/g, '');
  s = s.replace(/Ⅰ/g, 'I').replace(/Ⅱ/g, 'II').replace(/Ⅲ/g, 'III').replace(/Ⅳ/g, 'IV')
       .replace(/ⅰ/g, 'I').replace(/ⅱ/g, 'II').replace(/ⅲ/g, 'III').replace(/ⅳ/g, 'IV');
  s = s.replace(/IV/g, '4').replace(/III/g, '3').replace(/II/g, '2')
       .replace(/(^|[^I0-9])I(?![I0-9])/g, '$11');
  s = s.replace(/[()\[\]{},.\-_~]/g, '');   // 괄호·구두점은 표기 흔들림일 뿐
  return s.toLowerCase();
}
// 같은 시험이라도 2학년용/3학년용은 실제로 다른 시험지다. 이건 절대 합치면 안 되므로
// 이름 정규화에서 떼어내 따로 비교한다.
function detailGrade(s) {
  if (!s) return '';
  var m = /([1-3])\s*학년/.exec(s);
  return m ? m[1] : '';
}

function contentKey(r) {
  if (r.md5) return 'h:' + r.md5;
  return 'n:' + r.filename + '|' + (r.size == null ? '' : r.size);
}
function dedupeRecords(list) {
  var seen = {}, out = [];
  list.forEach(function (r) {
    var k = contentKey(r);
    if (seen[k]) { seen[k].dupCount++; return; }
    var copy = { rec: r, dupCount: 1 };
    seen[k] = copy;
    out.push(r);
  });
  return out;
}

// 같은 과목을 다르게 적은 것(고물II / 고금물리학II / 고급물리학II, 일반물리학1 /
// 물리학1 …)까지 갈라지면 "문제 없음 / 해설 없음"만 잔뜩 생기므로, 끝에 붙은
// 숫자가 같고 이름이 서로의 축약형(부분수열)이거나 한 글자 차이(오타)면 합친다.
function splitTrailingNum(s) {
  var m = /^(.*?)([1-4])$/.exec(s);
  return m ? [m[1], m[2]] : [s, ''];
}
function isSubsequence(a, b) { // a가 b의 부분수열인가 (고물 ⊂ 고급물리학)
  var i = 0;
  for (var j = 0; j < b.length && i < a.length; j++) if (a[i] === b[j]) i++;
  return i === a.length;
}
function editDistance1(a, b) { // 한 글자 이내 차이인가 (고금 vs 고급)
  if (Math.abs(a.length - b.length) > 1) return false;
  var i = 0, j = 0, diff = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length > b.length) i++;
    else if (a.length < b.length) j++;
    else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
function sameSubject(k1, k2) {
  var a = splitTrailingNum(k1), b = splitTrailingNum(k2);
  // 뒤 숫자가 둘 다 적혀 있는데 다르면 다른 과목이다(고급물리학1 vs 2).
  // 한쪽이 아예 안 적은 건 표기 생략일 뿐이라 같은 과목으로 본다
  // ("선형대수학" 해설 / "선형대수학I" 문제 → 같은 시험).
  if (a[1] && b[1] && a[1] !== b[1]) return false;
  var x = a[0], y = b[0];
  if (!x || !y) return false;
  return isSubsequence(x, y) || isSubsequence(y, x) || editDistance1(x, y);
}

// 같은 시험의 같은 문서유형이 여러 벌 남는 경우가 있다(같은 시험지를 A4/B4로
// 따로 스캔한 것 등). 내용이 조금씩 달라도 보는 사람 입장에선 한 장이면 되므로
// 화면에는 한 장만 내보낸다. 고를 때는 용량이 가장 큰 것(=제일 온전한 스캔)을 쓴다.
function pickBest(list) {
  if (!list || !list.length) return null;
  var best = list[0];
  for (var i = 1; i < list.length; i++) {
    if ((Number(list[i].size) || 0) > (Number(best.size) || 0)) best = list[i];
  }
  return best;
}
// 별지·듣기스크립트 같은 부속 자료도 문서유형별로 한 장씩만 남긴다
function pickBestPerDoctype(list) {
  var buckets = {}, order = [];
  list.forEach(function (r) {
    var k = r.doctype || '기타';
    if (!buckets[k]) { buckets[k] = []; order.push(k); }
    buckets[k].push(r);
  });
  return order.map(function (k) { return pickBest(buckets[k]); });
}

function clusterGroup(group) {
  // 세부과목(파일명 속 과목 표기)이 서로 다르면 파일 개수와 상관없이 항상 나눈다.
  // "문제 1 / 문제 2"처럼 보이지만 실은 고전문학과 현대문학처럼 서로 다른
  // 시험인 경우가 있어서, 중복처럼 보이는 걸 막으려면 무조건 라벨을 붙여야 함.
  var buckets = {};
  group.forEach(function (r) {
    var base = normDetail(r.subject_detail);
    var grade = detailGrade(r.subject_detail);
    var key = base ? base + '@' + grade : '__etc__';
    if (!buckets[key]) {
      buckets[key] = { label: r.subject_detail || '기타', base: base, grade: grade, records: [] };
    }
    buckets[key].records.push(r);
  });

  // 1차: 학년이 서로 어긋나지 않는 별칭끼리만 합친다.
  // ("생명과학4(2학년)"과 "(생명과학IV, 3학년)"은 이름은 같아도 다른 시험지다)
  var merged = [];
  Object.keys(buckets).forEach(function (k) {
    var bk = buckets[k];
    if (bk.base) {
      for (var i = 0; i < merged.length; i++) {
        var head = buckets[merged[i].keys[0]];
        if (head.base && head.grade === bk.grade && sameSubject(bk.base, head.base)) {
          merged[i].keys.push(k);
          return;
        }
      }
    }
    merged.push({ keys: [k] });
  });

  function recordsOf(m) {
    var out = [];
    m.keys.forEach(function (k) { out = out.concat(buckets[k].records); });
    return out;
  }
  function headOf(m) { return buckets[m.keys[0]]; }

  // 2차: 학년(또는 과목 표기 자체)이 안 적힌 그룹 붙이기.
  // 파일명에 "2학년"이 안 적힌 문제지 한 장이 따로 떨어져 있으면 양쪽 다
  // "문제 없음 / 해설 없음"이 되어버린다. 붙일 곳이 하나로 특정될 때만 붙인다:
  // (1) 후보가 애초에 하나뿐이거나, (2) 이 그룹이 가진 문서(문제 또는 해설)를
  //     아직 못 가진 후보가 딱 하나일 때.
  var changed = true;
  while (changed && merged.length > 1) {
    changed = false;
    for (var li = 0; li < merged.length; li++) {
      var L = merged[li], lh = headOf(L);
      if (lh.base && lh.grade) continue;          // 학년까지 적힌 그룹은 기준점
      var cands = [];
      for (var mi = 0; mi < merged.length; mi++) {
        if (mi === li) continue;
        var M = merged[mi], mh = headOf(M);
        if (lh.base && !(mh.base && sameSubject(lh.base, mh.base))) continue;
        cands.push(mi);
      }
      if (!cands.length) continue;
      var target = null;
      if (cands.length === 1) {
        target = cands[0];
      } else {
        var mine = recordsOf(L);
        var hasQ = mine.some(function (r) { return isProblem(r.doctype); });
        var hasA = mine.some(function (r) { return isSolution(r.doctype); });
        var needy = cands.filter(function (mi) {
          var rs = recordsOf(merged[mi]);
          var q = rs.some(function (r) { return isProblem(r.doctype); });
          var aa = rs.some(function (r) { return isSolution(r.doctype); });
          return (hasQ && !q) || (hasA && !aa);
        });
        if (needy.length === 1) target = needy[0];
      }
      if (target === null) continue;
      merged[target].keys = merged[target].keys.concat(L.keys);
      merged.splice(li, 1);
      changed = true;
      break;
    }
  }

  if (merged.length <= 1) return null; // 결국 다 같은 과목이면 나눌 의미 없음

  return merged.map(function (m) {
    var recs = [], best = null;
    m.keys.forEach(function (k) {
      recs = recs.concat(buckets[k].records);
      // 대표 이름은 파일이 가장 많은 표기로 하되, 이름 없는 그룹(__etc__)은 피한다
      if (!best || (buckets[k].base && (!buckets[best].base ||
          buckets[k].records.length > buckets[best].records.length))) best = k;
    });
    return { label: buckets[best].label, records: recs };
  }).sort(function (a, b) { return b.records.length - a.records.length; });
}

// ---- 분류 탭 ----
function buildCats() {
  var counts = {};
  DATA.forEach(function (r) {
    var c = r.category || '(미분류)';
    counts[c] = (counts[c] || 0) + 1;
  });
  var present = Object.keys(counts);
  present.sort(function (a, b) {
    var ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    if (ia < 0) ia = 99; if (ib < 0) ib = 99;
    return ia - ib || a.localeCompare(b, 'ko');
  });

  var box = document.getElementById('cats');
  box.innerHTML = '';

  var all = document.createElement('div');
  all.className = 'cat' + (state.cat === null ? ' on' : '');
  all.innerHTML = '전체<span class="n">' + DATA.length + '</span>';
  all.onclick = function () { state.cat = null; render(); };
  box.appendChild(all);

  present.forEach(function (c) {
    var el = document.createElement('div');
    el.className = 'cat' + (state.cat === c ? ' on' : '');
    el.innerHTML = c + '<span class="n">' + counts[c] + '</span>';
    el.onclick = function () { state.cat = (state.cat === c ? null : c); render(); };
    box.appendChild(el);
  });
}

// ---- 렌더 ----
function render() {
  buildCats();

  var rows = DATA.filter(function (r) {
    if (isHidden(r)) return false;   // 중복이라 직접 숨긴 파일
    if (state.cat && (r.category || '(미분류)') !== state.cat) return false;
    if (state.flagOnly && !isFlagged(r)) return false;
    if (state.favOnly && !isFavorite(r.category, r.subject)) return false;
    return matchesQuery(r, state.q);
  });

  // 데이터 생성 시각을 같이 보여준다 - 브라우저가 data.js를 캐시해서 옛날 걸
  // 보고 있는 경우를 바로 알아채려고 (안 바뀐 것 같으면 Ctrl+Shift+R)
  var ver = (typeof EXAM_DATA_VERSION !== 'undefined') ? EXAM_DATA_VERSION : null;
  // 같은 파일이 여러 폴더에 중복돼 있고, 같은 시험지도 A4/B4로 따로 스캔돼
  // 있어서 화면에는 시험마다 문제 한 장·해설 한 장만 내보낸다. 그래서
  // '몇 개 파일'보다 '몇 개 시험'이 실제로 보이는 것과 맞는다.
  var examSet = {};
  rows.forEach(function (r) {
    examSet[(r.category || '') + '|' + examKey(r)] = 1;
  });
  document.getElementById('status').textContent =
    Object.keys(examSet).length + '개 시험  ·  파일 ' + rows.length + '개' +
    (ver ? '  ·  데이터 ' + ver : '');

  // 직접 숨긴 파일이 있으면 알려주고 되돌릴 수 있게 한다
  var hiddenIds = Object.keys(hidden);
  var note = document.getElementById('hiddennote');
  if (hiddenIds.length) {
    note.style.display = 'block';
    note.innerHTML = '';
    note.appendChild(document.createTextNode(
      '중복이라고 직접 숨긴 파일 ' + hiddenIds.length + '개 (이 브라우저에만 적용됨)'));
    var undo = document.createElement('button');
    undo.textContent = '모두 되돌리기';
    undo.onclick = function () { unhideAll(); render(); };
    note.appendChild(undo);
  } else {
    note.style.display = 'none';
  }

  var out = document.getElementById('out');
  out.innerHTML = '';
  var emptyEl = document.getElementById('empty');
  if (!rows.length) {
    emptyEl.style.display = 'block';
    if (state.favOnly && !hasAnyFavorite()) {
      emptyEl.innerHTML = '즐겨찾기한 과목이 없습니다.<br>과목 이름 옆 ☆를 눌러 추가하거나, ' +
        '<a href="#" id="showall">전체 보기로 전환</a>하세요.';
      var showAll = document.getElementById('showall');
      if (showAll) {
        showAll.addEventListener('click', function (e) {
          e.preventDefault();
          state.favOnly = false;
          saveFavOnly(false);
          document.getElementById('favbtn').className = '';
          render();
        });
      }
    } else {
      emptyEl.textContent = '해당하는 자료가 없습니다.';
    }
    updateSelectionBar();
    return;
  }
  emptyEl.style.display = 'none';

  // 분류 > 과목 > 시험 으로 묶기
  var byCat = {};
  rows.forEach(function (r) {
    var c = r.category || '(미분류)';
    var s = r.subject || '(과목 미상)';
    byCat[c] = byCat[c] || {};
    byCat[c][s] = byCat[c][s] || {};
    var k = examKey(r);
    (byCat[c][s][k] = byCat[c][s][k] || []).push(r);
  });

  var catNames = Object.keys(byCat).sort(function (a, b) {
    var ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    if (ia < 0) ia = 99; if (ib < 0) ib = 99;
    return ia - ib || a.localeCompare(b, 'ko');
  });

  catNames.forEach(function (cName) {
    var subjects = Object.keys(byCat[cName]).sort(function (a, b) {
      return a.localeCompare(b, 'ko');
    });

    // 분류를 탭으로 이미 하나만 고른 상태면 굳이 한 겹 더 감싸지 않는다
    var catBox = out;
    if (!state.cat && catNames.length > 1) {
      var catDet = document.createElement('details');
      catDet.className = 'category';
      // 검색·필터 중에는 늘 펼쳐 보여주고, 그 밖에는 접어둔 기억을 따른다
      catDet.open = !!(state.q || state.flagOnly) || !isCatClosed(cName);
      var catExams = 0;
      subjects.forEach(function (sn) { catExams += Object.keys(byCat[cName][sn]).length; });
      var catSum = document.createElement('summary');
      catSum.innerHTML = '<span class="cat-name"></span><span class="cat-meta">'
        + subjects.length + '개 과목 · ' + catExams + '개 시험</span>';
      catSum.querySelector('.cat-name').textContent = cName;
      catDet.appendChild(catSum);
      catDet.addEventListener('toggle', function () {
        if (!state.q && !state.flagOnly) setCatClosed(cName, !catDet.open);
      });
      out.appendChild(catDet);
      catBox = catDet;
    }

    subjects.forEach(function (sName) {
      var exams = byCat[cName][sName];
      var keys = Object.keys(exams);

      // 최근에 본 시험이 위로 (연도 내림차순 → 그 해 안에서도 나중에 본 것부터)
      keys.sort(function (a, b) {
        var A = a.split('|'), B = b.split('|');
        if (A[1] !== B[1]) return (B[1] || '').localeCompare(A[1] || '');
        return examOrder(B[2], B[3]) - examOrder(A[2], A[3]);
      });

      var fileCount = 0;
      keys.forEach(function (k) { fileCount += exams[k].length; });

      var det = document.createElement('details');
      det.className = 'subject';
      // 검색 중이거나 결과가 적으면 자동으로 펼침
      if (state.q || state.flagOnly || rows.length <= 60) det.open = true;

      var sum = document.createElement('summary');
      sum.innerHTML =
        '<span class="subj-name"></span>' +
        '<span class="subj-meta">' + keys.length + '개 시험 · ' + fileCount + '개 파일</span>' +
        '<span class="star" title="즐겨찾기">' + (isFavorite(cName, sName) ? '★' : '☆') + '</span>';
      sum.querySelector('.subj-name').textContent = sName;
      var starEl = sum.querySelector('.star');
      if (isFavorite(cName, sName)) starEl.className = 'star on';
      starEl.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        toggleFavorite(cName, sName);
        render();
      });
      det.appendChild(sum);

      var body = document.createElement('div');
      body.className = 'subj-body';

      keys.forEach(function (k) {
        var groupAll = exams[k];
        // 내용이 같은 파일이 두 벌 들어있는 경우(동명 폴더) 하나만 보여준다
        var group = dedupeRecords(groupAll);
        var dupHidden = groupAll.length - group.length;
        var first = group[0];

        var etc = pickBestPerDoctype(group.filter(function (r) {
          return !isProblem(r.doctype) && !isSolution(r.doctype);
        }));

        var row = document.createElement('div');
        row.className = 'exam';

        var label = document.createElement('div');
        label.className = 'exam-label';

        var when = document.createElement('div');
        when.className = 'exam-when';
        if (first.year) {
          var y = document.createElement('span');
          y.className = 'yr'; y.textContent = first.year;
          when.appendChild(y);
        } else {
          var u = document.createElement('span');
          u.className = 'unknown'; u.textContent = '연도 미상';
          when.appendChild(u);
        }
        var tail = [first.semester ? first.semester + '학기' : null, first.examtype]
          .filter(Boolean).join(' ');
        if (tail) when.appendChild(document.createTextNode('  ' + tail));

        // "폴더 위치 다름"은 드라이브에서 파일이 엉뚱한 이름의 폴더에 들어있다는
        // 뜻일 뿐이고, 화면에 보이는 연도·학기·시험종류는 PDF 표지 기준으로 맞다.
        // 여기서 고칠 것도 없는 표시가 78줄에 붙어 있어서 뺐다.
        // 같은 파일이 여러 벌 있는 건 이제 흔한 일이고 자동으로 합쳐지므로
        // 따로 표시하지 않는다(1500줄 넘게 배지가 붙어 오히려 지저분했다).
        if (dupHidden === 0 && group.some(function (r) { return r.duplicate_sibling_folder; })) {
          var f2b = document.createElement('span');
          f2b.className = 'flag muted'; f2b.textContent = '동명 폴더';
          f2b.title = '같은 이름의 형제 폴더가 2개 있는데, 이 시험 파일들은 서로 내용이 달라서 합치지 않았음';
          when.appendChild(f2b);
        }
        label.appendChild(when);

        var fn = document.createElement('div');
        fn.className = 'exam-files';
        label.appendChild(fn);
        // 실제로 화면에 나온 파일 이름만 적는다. 숨긴 판본 이름까지 적어두면
        // "버튼은 하나인데 파일명은 넷"이라 오히려 헷갈린다. (아래에서 채움)
        var shownRecs = etc.slice();

        // 문제/해설로 분류 안 되는 파일은 따로 링크로
        if (etc.length) {
          var ex = document.createElement('div');
          ex.className = 'extra';
          etc.forEach(function (r) {
            var w = document.createElement('span');
            w.className = 'btn-wrap';
            w.appendChild(makeCheckbox(r));
            var a = document.createElement('a');
            a.href = viewUrl(r); a.target = '_blank'; a.rel = 'noopener';
            a.textContent = (r.doctype || '기타') + ' 열기';
            w.appendChild(a);
            ex.appendChild(w);
          });
          label.appendChild(ex);
        }

        row.appendChild(label);

        function addBtns(list, cls, text, container) {
          var rec = pickBest(list);
          if (!rec) {
            var none = document.createElement('span');
            none.className = 'btn-none';
            none.textContent = text + ' 없음';
            container.appendChild(none);
            return;
          }
          // 같은 문서유형이 여러 벌이어도 한 장만 내보낸다 (pickBest 주석 참고)
          shownRecs.push(rec);
          var wrap = document.createElement('span');
          wrap.className = 'btn-wrap';
          wrap.appendChild(makeCheckbox(rec));
          var a = document.createElement('a');
          a.className = 'btn ' + cls;
          a.href = viewUrl(rec); a.target = '_blank'; a.rel = 'noopener';
          a.textContent = text;
          wrap.appendChild(a);
          container.appendChild(wrap);
        }

        var clusters = clusterGroup(group);
        if (!clusters) {
          // 평소 경우: 문제/해설 버튼 한 줄
          var btns = document.createElement('div');
          btns.className = 'btns';
          addBtns(group.filter(function (r) { return isProblem(r.doctype); }), 'q', '문제', btns);
          addBtns(group.filter(function (r) { return isSolution(r.doctype); }), 'a', '해설', btns);
          row.appendChild(btns);
        } else {
          // 한 시험에 파일이 너무 많이 몰린 경우(예: "문학"에 고전/현대문학이 섞임) -
          // 파일명 속 세부과목별로 미니 줄을 나눠서 보여준다 (페어링 자체는 그대로)
          row.className = 'exam exam-clustered';
          var btnsWrap = document.createElement('div');
          btnsWrap.className = 'btns-clustered';
          clusters.forEach(function (c) {
            var mini = document.createElement('div');
            mini.className = 'mini-cluster';
            var miniLabel = document.createElement('span');
            miniLabel.className = 'mini-label';
            miniLabel.textContent = c.label;
            mini.appendChild(miniLabel);
            var mbtns = document.createElement('div');
            mbtns.className = 'btns';
            addBtns(c.records.filter(function (r) { return isProblem(r.doctype); }), 'q', '문제', mbtns);
            addBtns(c.records.filter(function (r) { return isSolution(r.doctype); }), 'a', '해설', mbtns);
            mini.appendChild(mbtns);
            btnsWrap.appendChild(mini);
          });
          row.appendChild(btnsWrap);
        }

        var names = shownRecs.map(function (r) { return r.filename; });
        fn.textContent = names.slice(0, 2).join('   ·   ')
          + (names.length > 2 ? '   ·   외 ' + (names.length - 2) + '개' : '');
        if (names.length > 2) fn.title = names.join('\n');

        body.appendChild(row);
      });

      det.appendChild(body);
      catBox.appendChild(det);
    });
  });

  updateSelectionBar();
}

document.getElementById('q').addEventListener('input', function (e) {
  state.q = e.target.value.trim();
  render();
});
document.getElementById('flagbtn').addEventListener('click', function () {
  state.flagOnly = !state.flagOnly;
  this.className = state.flagOnly ? 'on' : '';
  render();
});

var favbtn = document.getElementById('favbtn');
favbtn.className = state.favOnly ? 'on' : '';
favbtn.addEventListener('click', function () {
  state.favOnly = !state.favOnly;
  saveFavOnly(state.favOnly);
  this.className = state.favOnly ? 'on' : '';
  render();
});

document.getElementById('clearSelBtn').addEventListener('click', function () {
  state.selected = {};
  render();
});

document.getElementById('downloadBtn').addEventListener('click', function () {
  var recs = Object.values(state.selected);
  if (!recs.length) return;
  // 예전에는 숨긴 iframe으로 uc?export=download를 불러 조용히 저장했지만,
  // 구글이 다운로드 전에 로그인/확인 화면을 끼워 넣게 되면서 숨긴 iframe 안에서는
  // 그 화면이 아예 안 보여 아무 일도 안 일어나는 것처럼 되어버렸다. 그래서 각 파일을
  // 새 탭(드라이브 보기 화면)으로 열어, 로그인이 필요하면 사용자가 직접 보고 처리하게 한다.
  recs.forEach(function (r, i) {
    setTimeout(function () { window.open(viewUrl(r), '_blank', 'noopener'); }, i * 300);
  });
});

render();
</script>
</body>
</html>
