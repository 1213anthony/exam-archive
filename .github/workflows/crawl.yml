name: 기출문제 재크롤링

# 두 가지로 돈다.
# 1) 자동(15분마다): 드라이브에 "지난 크롤링 이후 바뀐 게 있나"만 가볍게 묻고,
#    바뀐 게 없으면 아무것도 안 한다. 바뀐 게 있으면 업로드가 20분 동안 잠잠해진
#    뒤에만 전체 크롤링 -> data.js 커밋 -> 사이트 반영 (반쪽 업로드 상태 방지).
# 2) 수동(관리자 패널의 "재크롤링" 버튼 / Actions 탭): 감지 없이 바로 전체 크롤링.
#
# 기준 시각은 .github/remote_crawl_state.json에 남겨서 다음 실행이 이어받는다
# (러너는 매번 새로 떠서 로컬 파일이 남지 않기 때문).
on:
  workflow_dispatch:
  schedule:
    # 정각/15분 단위는 GitHub 전체가 몰려서 지연·누락이 잦다 - 살짝 비켜서 돈다
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

# 전체 크롤링이 도는 중에 다음 감지가 겹쳐 돌지 않게
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install google-auth-oauthlib google-api-python-client

      # 로컬에서 crawl.py를 한 번 돌려 만든 token.json 내용을 레포 시크릿
      # DRIVE_TOKEN_JSON에 넣어둬야 한다(refresh_token으로 자동 갱신됨).
      - name: restore drive credentials
        run: echo "$DRIVE_TOKEN_JSON" > token.json
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}

      - name: restore last crawl time
        run: |
          if [ -f .github/remote_crawl_state.json ]; then
            cp .github/remote_crawl_state.json crawl_state.json
          fi

      - name: detect changes
        id: detect
        if: github.event_name == 'schedule'
        run: |
          status=$(python crawl.py --detect | tail -n 1)
          echo "결과: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: crawl (full)
        if: github.event_name != 'schedule' || steps.detect.outputs.status == 'changed'
        run: python crawl.py --full

      - name: commit and push
        if: github.event_name != 'schedule' || steps.detect.outputs.status == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp crawl_state.json .github/remote_crawl_state.json
          git add data.js .github/remote_crawl_state.json
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 안 함"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            git commit -m "자동 반영: 드라이브 변경 감지"
          else
            git commit -m "재크롤링 (GitHub Actions, 실행자: ${{ github.actor }})"
          fi
          # 그사이 누가 푸시했으면(로컬 update.bat 등) 방금 크롤링한 쪽을 살려서 합친다
          git pull --rebase -X theirs
          git push
